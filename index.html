<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>우리家 가계부</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#F8FAFC;max-width:430px;margin:0 auto;min-height:100vh}
button,input,select{font-family:inherit;cursor:pointer}
.hd{background:linear-gradient(135deg,#0F766E,#14B8A6);padding:20px 16px 16px;border-radius:0 0 24px 24px}
.mn{display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;-webkit-box-pack:center;justify-content:center;gap:16px;margin-top:6px}
.mb{background:rgba(255,255,255,0.2);border:none;border-radius:8px;padding:6px 14px;color:white;font-size:24px;line-height:1}
.card{background:white;border-radius:20px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,0.06);margin:12px 16px 0}
.ct{font-size:13px;font-weight:700;color:#1E293B;margin-bottom:10px}
.fr{display:-webkit-box;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.fb{padding:5px 12px;border-radius:20px;border:none;font-size:11px;font-weight:600;white-space:nowrap;background:#F1F5F9;color:#64748B}
.fb.sm{padding:5px 9px;font-size:10px}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:50;display:none;-webkit-box-align:end;align-items:flex-end}
.modal-bg.open{display:-webkit-box;display:flex}
.modal{background:white;border-radius:24px 24px 0 0;padding:20px 20px 40px;width:100%;max-height:90vh;overflow-y:auto}
.fi{width:100%;padding:11px 14px;border:1px solid #E2E8F0;border-radius:12px;font-size:14px;outline:none;background:#F8FAFC;margin-top:5px;-webkit-appearance:none}
.bnav{position:fixed;bottom:0;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);width:100%;max-width:430px;background:white;border-top:1px solid #F1F5F9;display:-webkit-box;display:flex;z-index:40;box-shadow:0 -4px 20px rgba(0,0,0,0.08)}
.nb{-webkit-box-flex:1;flex:1;display:-webkit-box;display:flex;-webkit-box-orient:vertical;-webkit-box-direction:normal;flex-direction:column;-webkit-box-align:center;align-items:center;-webkit-box-pack:center;justify-content:center;padding:8px 0 10px;border:none;background:none;position:relative}
.nl{font-size:9px;margin-top:2px;font-weight:600;color:#94A3B8}
.nb.on .nl{color:#0D9488}
.nd{position:absolute;bottom:0;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);width:18px;height:3px;background:#0D9488;border-radius:2px 2px 0 0;display:none}
.nb.on .nd{display:block}
.nplus{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#0F766E,#14B8A6);border:none;color:white;font-size:28px;line-height:46px;text-align:center;margin-top:-18px;box-shadow:0 4px 12px rgba(13,148,136,0.4);cursor:pointer}
</style>
</head>
<body>
<div class="hd">
  <div style="display:-webkit-box;display:flex;-webkit-box-pack:justify;justify-content:space-between;-webkit-box-align:center;align-items:center">
    <span style="color:rgba(255,255,255,0.9);font-size:13px;font-weight:600">💑 우리家 가계부 2026</span>
    <span style="font-size:18px">🔔</span>
  </div>
  <div class="mn">
    <button class="mb" onclick="chM(-1)">&#8249;</button>
    <span id="mLbl" style="color:white;font-size:22px;font-weight:700">2026년 5월</span>
    <button class="mb" onclick="chM(1)">&#8250;</button>
  </div>
</div>

<!-- 홈 -->
<div id="p-home" style="padding-bottom:80px">
  <div style="display:-webkit-box;display:flex;gap:8px;padding:16px 16px 0">
    <div style="-webkit-box-flex:1;flex:1;background:white;border-radius:16px;padding:12px 8px;box-shadow:0 2px 8px rgba(0,0,0,0.06);text-align:center">
      <div style="font-size:11px;font-weight:600;color:#10B981;margin-bottom:4px">📈 수입</div>
      <div id="v-i" style="font-size:11px;font-weight:700;color:#1E293B">-</div>
    </div>
    <div style="-webkit-box-flex:1;flex:1;background:white;border-radius:16px;padding:12px 8px;box-shadow:0 2px 8px rgba(0,0,0,0.06);text-align:center">
      <div style="font-size:11px;font-weight:600;color:#EF4444;margin-bottom:4px">📉 지출</div>
      <div id="v-e" style="font-size:11px;font-weight:700;color:#1E293B">-</div>
    </div>
    <div style="-webkit-box-flex:1;flex:1;background:white;border-radius:16px;padding:12px 8px;box-shadow:0 2px 8px rgba(0,0,0,0.06);text-align:center">
      <div style="font-size:11px;font-weight:600;color:#3B82F6;margin-bottom:4px">🐷 저축</div>
      <div id="v-s" style="font-size:11px;font-weight:700;color:#1E293B">-</div>
    </div>
  </div>
  <div id="bal" style="margin:10px 16px 0;padding:12px 16px;border-radius:14px;display:-webkit-box;display:flex;-webkit-box-pack:justify;justify-content:space-between;-webkit-box-align:center;align-items:center;border:1px solid #A7F3D0;background:#ECFDF5">
    <span style="font-size:13px;color:#64748B;font-weight:500">이달의 잔액</span>
    <span id="v-b" style="font-size:17px;font-weight:700;color:#059669">-</span>
  </div>
  <div class="card" style="display:-webkit-box;display:flex;-webkit-box-pack:justify;justify-content:space-between;-webkit-box-align:center;align-items:center">
    <div>
      <div class="ct" style="margin-bottom:4px">💰 예비비 현황</div>
      <div style="font-size:11px;color:#64748B">남은 예비비</div>
      <div id="homeReserveRemaining" style="font-size:18px;font-weight:800;color:#0D9488;margin-top:2px">-</div>
    </div>
    <button onclick="goTab('reserve')" style="background:#CCFBF1;color:#0F766E;border:none;border-radius:12px;padding:9px 12px;font-size:12px;font-weight:700">예비비 보기</button>
  </div>
  <div class="card">
    <div class="ct">카테고리별 지출</div>
    <div id="pie"></div>
  </div>
  <div class="card" style="padding:0;overflow:hidden">
    <div style="display:-webkit-box;display:flex;-webkit-box-pack:justify;justify-content:space-between;-webkit-box-align:center;align-items:center;padding:12px 16px 8px">
      <span id="rc" class="ct" style="margin:0">최근 거래</span>
      <button onclick="goTab('list')" style="font-size:12px;color:#0D9488;background:none;border:none;font-weight:600">전체보기</button>
    </div>
    <div id="rl"></div>
  </div>
</div>

<!-- 내역 -->
<div id="p-list" style="display:none;padding-bottom:80px">
  <div style="padding:10px 16px 0">
    <div style="display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;background:white;border-radius:12px;padding:8px 12px;border:1px solid #E2E8F0;margin-bottom:8px">
      <span style="margin-right:8px;color:#94A3B8">🔍</span>
      <input type="text" id="srch" placeholder="검색..." oninput="renderList()" style="-webkit-box-flex:1;flex:1;border:none;outline:none;font-size:13px;background:none">
    </div>
    <div class="fr" id="ft"></div>
    <div class="fr" id="fc" style="padding-top:4px"></div>
    <div class="fr" id="fm" style="padding-top:4px;padding-bottom:6px"></div>
  </div>
  <div style="margin:4px 16px 8px;padding:8px 14px;background:#F8FAFC;border-radius:10px;display:-webkit-box;display:flex;-webkit-box-pack:justify;justify-content:space-between">
    <span id="lc" style="font-size:12px;color:#64748B">0건</span>
    <span id="lt" style="font-size:12px;font-weight:700;color:#DC2626"></span>
  </div>
  <div id="tl" style="background:white"></div>
</div>

<!-- 통계 -->
<div id="p-stats" style="display:none;padding-bottom:80px">
  <div class="card">
    <div class="ct">월별 현황 (1~12월)</div>
    <div id="bc" style="display:-webkit-box;display:flex;-webkit-box-align:end;align-items:flex-end;height:120px;gap:4px;padding:0 8px;overflow-x:auto"></div>
    <div style="display:-webkit-box;display:flex;-webkit-box-pack:center;justify-content:center;gap:16px;margin-top:8px;font-size:10px;color:#64748B">
      <span><span style="display:inline-block;width:8px;height:8px;background:#10B981;border-radius:2px;margin-right:3px"></span>수입</span>
      <span><span style="display:inline-block;width:8px;height:8px;background:#EF4444;border-radius:2px;margin-right:3px"></span>지출</span>
      <span><span style="display:inline-block;width:8px;height:8px;background:#3B82F6;border-radius:2px;margin-right:3px"></span>저축</span>
    </div>
  </div>
  <div class="card"><div class="ct">카테고리별 지출 합계</div><div id="cs"></div></div>
</div>

<!-- 설정 -->
<div id="p-settings" style="display:none;padding-bottom:80px">
  <div class="card"><div id="settingsSummaryTitle" class="ct">📊 2026년 전체 현황 (0건)</div><div id="ts"></div></div>
  <div class="card" style="display:-webkit-box;display:flex;-webkit-box-pack:justify;justify-content:space-between;-webkit-box-align:center;align-items:center">
    <div>
      <div class="ct" style="margin-bottom:4px">💰 예비비</div>
      <div style="font-size:11px;color:#64748B">엑셀 예비비 시트 구조 미리보기</div>
    </div>
    <button onclick="goTab('reserve')" style="background:#0D9488;color:white;border:none;border-radius:12px;padding:9px 12px;font-size:12px;font-weight:700">예비비 보기</button>
  </div>
  <div class="card"><div class="ct">💳 지출방법</div><div id="mt" style="margin-top:4px"></div></div>
</div>

<!-- 예비비 -->
<div id="p-reserve" style="display:none;padding-bottom:80px">
  <div class="card" style="display:-webkit-box;display:flex;-webkit-box-pack:justify;justify-content:space-between;-webkit-box-align:center;align-items:center">
    <div>
      <div class="ct" style="margin-bottom:4px">💰 예비비</div>
      <div style="font-size:11px;color:#64748B">원본 엑셀 예비비 시트 구조</div>
    </div>
    <button onclick="goTab('settings')" style="background:#F1F5F9;color:#64748B;border:none;border-radius:12px;padding:8px 10px;font-size:12px;font-weight:700">설정으로</button>
  </div>
  <div style="display:-webkit-box;display:flex;gap:8px;padding:12px 16px 0">
    <div style="-webkit-box-flex:1;flex:1;background:white;border-radius:16px;padding:12px 8px;box-shadow:0 2px 8px rgba(0,0,0,0.06);text-align:center">
      <div style="font-size:11px;font-weight:600;color:#0D9488;margin-bottom:4px">총 예산</div>
      <div id="rvTotal" style="font-size:11px;font-weight:700;color:#1E293B">-</div>
    </div>
    <div style="-webkit-box-flex:1;flex:1;background:white;border-radius:16px;padding:12px 8px;box-shadow:0 2px 8px rgba(0,0,0,0.06);text-align:center">
      <div style="font-size:11px;font-weight:600;color:#EF4444;margin-bottom:4px">누적 지출</div>
      <div id="rvSpent" style="font-size:11px;font-weight:700;color:#1E293B">-</div>
    </div>
    <div style="-webkit-box-flex:1;flex:1;background:white;border-radius:16px;padding:12px 8px;box-shadow:0 2px 8px rgba(0,0,0,0.06);text-align:center">
      <div style="font-size:11px;font-weight:600;color:#10B981;margin-bottom:4px">남은 예산</div>
      <div id="rvRemain" style="font-size:11px;font-weight:700;color:#1E293B">-</div>
    </div>
  </div>
  <div class="card"><div class="ct">예비비 분류</div><div id="rvCats"></div></div>
  <div class="card"><div class="ct">예비비 입금 내역</div><div id="rvDeposits"></div></div>
  <div class="card"><div class="ct">예비비 지출 내역</div><div id="rvExpenses"></div></div>
</div>

<!-- 모달 -->
<div id="modal" class="modal-bg">
  <div class="modal">
    <div style="display:-webkit-box;display:flex;-webkit-box-pack:justify;justify-content:space-between;-webkit-box-align:center;align-items:center;margin-bottom:18px">
      <span style="font-size:17px;font-weight:700;color:#1E293B">거래 추가</span>
      <button onclick="closeM()" style="background:#F1F5F9;border:none;border-radius:10px;padding:8px 10px;font-size:16px">✕</button>
    </div>
    <div style="display:-webkit-box;display:flex;gap:8px;margin-bottom:18px">
      <button id="tb0" onclick="setT('지출')" style="-webkit-box-flex:1;flex:1;padding:10px 0;border-radius:12px;border:none;font-size:13px;font-weight:600;background:#EF4444;color:white">지출</button>
      <button id="tb1" onclick="setT('수입')" style="-webkit-box-flex:1;flex:1;padding:10px 0;border-radius:12px;border:none;font-size:13px;font-weight:600;background:#F1F5F9;color:#64748B">수입</button>
      <button id="tb2" onclick="setT('저축')" style="-webkit-box-flex:1;flex:1;padding:10px 0;border-radius:12px;border:none;font-size:13px;font-weight:600;background:#F1F5F9;color:#64748B">저축</button>
    </div>
    <div style="margin-bottom:12px"><label style="font-size:12px;font-weight:600;color:#64748B;display:block">📅 날짜</label><input type="date" id="fd" class="fi"></div>
    <div style="margin-bottom:12px"><label style="font-size:12px;font-weight:600;color:#64748B;display:block">✏️ 내용</label><input type="text" id="fcontent" placeholder="예) 마트 장보기" class="fi"></div>
    <div style="margin-bottom:12px"><label style="font-size:12px;font-weight:600;color:#64748B;display:block">💰 금액 (원)</label><input type="number" id="fa" placeholder="0" class="fi"></div>
    <div style="margin-bottom:12px"><label style="font-size:12px;font-weight:600;color:#64748B;display:block">📂 대분류</label><select id="fcat" class="fi" onchange="updSub()"></select></div>
    <div style="margin-bottom:12px"><label style="font-size:12px;font-weight:600;color:#64748B;display:block">🏷 소분류</label><select id="fsub" class="fi"></select></div>
    <div style="margin-bottom:12px"><label style="font-size:12px;font-weight:600;color:#64748B;display:block">💳 지출방법</label><select id="fmet" class="fi"></select></div>
    <button onclick="addTx()" style="width:100%;margin-top:18px;padding:15px;background:linear-gradient(135deg,#0F766E,#14B8A6);color:white;border:none;border-radius:16px;font-size:15px;font-weight:700">✅ 추가하기</button>
  </div>
</div>

<!-- 하단 네비 -->
<div class="bnav">
  <button class="nb on" id="n-home" onclick="goTab('home')"><span style="font-size:20px">🏠</span><span class="nl">홈</span><div class="nd"></div></button>
  <button class="nb" id="n-list" onclick="goTab('list')"><span style="font-size:20px">📋</span><span class="nl">내역</span><div class="nd"></div></button>
  <button class="nplus" onclick="openM()">＋</button>
  <button class="nb" id="n-stats" onclick="goTab('stats')"><span style="font-size:20px">📊</span><span class="nl">통계</span><div class="nd"></div></button>
  <button class="nb" id="n-settings" onclick="goTab('settings')"><span style="font-size:20px">⚙️</span><span class="nl">설정</span><div class="nd"></div></button>
</div>

function normalizeRows(rows){
  var tx=[];
  rows=rows||[];
  for(var i=0;i<rows.length;i++)tx.push(normalizeTx(rows[i]));
  return tx;
}

function loadData(){
  // API_BASE_URL이 비어 있으면 RAW를 사용하고, 값이 생기면 Apps Script ?action=load 응답으로 교체한다.
  var fallback=normalizeRows(RAW);
  if(!API_BASE_URL||typeof fetch!=='function')return fallback;
  fetch(API_BASE_URL+'?action=load')
    .then(function(res){if(!res.ok)throw new Error('HTTP '+res.status);return res.json();})
    .then(function(data){
      var rows=data&&data.transactions?data.transactions:data;
      if(data&&data.reserve)RESERVE_DATA=normalizeReserveData(data.reserve);
      BTX=normalizeRows(rows);
      refreshVisible();
    })
    .catch(function(err){
      console.warn('Google Sheets 데이터 로드 실패, RAW 데이터로 표시합니다.', err);
      BTX=fallback;
      refreshVisible();
    });
  return fallback;
}

function normalizeTx(src){
  var t={};
  if(Object.prototype.toString.call(src)==='[object Array]'){
    t={id:src[0],date:src[1],content:src[2],amount:src[3],category:src[4],sub:src[5],method:src[6],month:src[7]};
  }else{
    t={id:src.id,date:src.date,content:src.content,amount:src.amount,category:src.category,sub:src.sub,method:src.method,month:src.month,type:src.type};
  }
  t.id=t.id||Date.now();
  t.date=t.date||(''+APP_YEAR+'-01-01');
  t.content=t.content||'';
  t.amount=Math.abs(parseInt(t.amount,10)||0);
  t.category=t.category||'기타';
  t.sub=t.sub||'';
  t.method=t.method||'';
  t.month=parseInt(t.month||String(t.date).slice(5,7),10)||1;
  if(t.month<MIN_MONTH||t.month>MAX_MONTH)t.month=MIN_MONTH;
  t.type=t.type||(t.category==='수입'?'수입':t.category==='저축'?'저축':'지출');
  return t;
}

function computeMonthlySummary(tx){
  var ms={};
  for(var m=MIN_MONTH;m<=MAX_MONTH;m++)ms[m]={i:0,e:0,s:0};
  for(var i=0;i<tx.length;i++){
    var t=normalizeTx(tx[i]), m=t.month;
    if(!ms[m])ms[m]={i:0,e:0,s:0};
    if(t.type==='수입')ms[m].i+=t.amount;
    else if(t.type==='저축')ms[m].s+=t.amount;
    else if(t.type==='지출'&&t.amount>0)ms[m].e+=t.amount;
  }
  return ms;
}

function normalizeReserveData(src){
  src=src||{};
  var out={summary:{totalBudget:0,totalSpent:0,remaining:0},categories:[],deposits:[],expenses:[]};
  var cats=src.categories||[];
  for(var i=0;i<cats.length;i++){
    var c=cats[i]||{};
    var budget=parseInt(c.budget,10)||0, spent=parseInt(c.spent,10)||0;
    out.categories.push({name:c.name||'',budget:budget,spent:spent,remaining:c.remaining!=null?(parseInt(c.remaining,10)||0):(budget-spent),memo:c.memo||''});
  }
  var deps=src.deposits||[];
  for(var j=0;j<deps.length;j++){
    var d=deps[j]||{};
    out.deposits.push({date:d.date||'',amount:parseInt(d.amount,10)||0,content:d.content||''});
  }
  var exps=src.expenses||[];
  for(var k=0;k<exps.length;k++){
    var e=exps[k]||{};
    out.expenses.push({no:e.no||e.id||k+1,date:e.date||'',content:e.content||'',amount:parseInt(e.amount,10)||0,category:e.category||'',memo:e.memo||''});
  }
  out.summary=computeReserveSummary(out);
  return out;
}

function computeReserveSummary(data){
  data=data||RESERVE_DATA;
  var totalBudget=0,totalSpent=0;
  var deposits=data.deposits||[], categories=data.categories||[], expenses=data.expenses||[];
  for(var i=0;i<deposits.length;i++)totalBudget+=parseInt(deposits[i].amount,10)||0;
  if(totalBudget===0){for(var j=0;j<categories.length;j++)totalBudget+=parseInt(categories[j].budget,10)||0;}
  for(var k=0;k<expenses.length;k++)totalSpent+=parseInt(expenses[k].amount,10)||0;
  return {totalBudget:totalBudget,totalSpent:totalSpent,remaining:totalBudget-totalSpent};
}

function objArr(o){var a=[];for(var k in o){if(o.hasOwnProperty(k))a.push([k,o[k]]);}return a;}
// 배열 중복 제거
function uniq(arr){var seen={},r=[];for(var i=0;i<arr.length;i++){if(!seen[arr[i]]){seen[arr[i]]=1;r.push(arr[i]);}}return r;}
// 배열 정렬 (숫자 내림차순)
function sortDesc(arr){return arr.slice().sort(function(a,b){return b[1]-a[1];});}

// ── 탭 전환 ──
function goTab(t){
  var tabs=['home','list','stats','settings','reserve'];
  for(var i=0;i<tabs.length;i++){
    gi('p-'+tabs[i]).style.display='none';
    var nb=gi('n-'+tabs[i]);
    if(nb)nb.className=nb.className.replace(/ on/g,'');
  }
  gi('p-'+t).style.display='block';
  var nb=gi('n-'+(t==='reserve'?'settings':t));
  if(nb&&nb.className.indexOf(' on')<0)nb.className+=(' on');
  if(t==='list')renderList();
  else if(t==='stats')renderStats();
  else if(t==='settings')renderSettings();
  else if(t==='reserve')renderReserve();
  else renderHome();
}

function chM(d){
  var n=CM+d;if(n<MIN_MONTH||n>MAX_MONTH)return;
  CM=n;gi('mLbl').textContent=APP_YEAR+'년 '+CM+'월';
  AF={type:'전체',cat:'전체',method:'전체'};
  refreshVisible();
}

// ── 홈 렌더 ──
function renderHome(){
  var s=computeMonthlySummary(allTx())[CM]||{i:0,e:0,s:0};
  gi('v-i').textContent=fmt(s.i);
  gi('v-e').textContent=fmt(s.e);
  gi('v-s').textContent=fmt(s.s);
  var bal=s.i-s.e-s.s;
  var bc=gi('bal');
  bc.style.background=bal>=0?'#ECFDF5':'#FFF1F2';
  bc.style.borderColor=bal>=0?'#A7F3D0':'#FECDD3';
  var bv=gi('v-b');
  bv.textContent=(bal>=0?'+':'')+fmt(bal);
  bv.style.color=bal>=0?'#059669':'#DC2626';
  var tx=allTx();
  var mTx=[];for(var i=0;i<tx.length;i++){if(tx[i].month===CM)mTx.push(tx[i]);}
  gi('rc').textContent='최근 거래 ('+mTx.length+'건)';
  var cm={};
  for(var i=0;i<mTx.length;i++){var t=mTx[i];if(t.type==='지출'&&t.amount>0)cm[t.category]=(cm[t.category]||0)+t.amount;}
  var sorted=sortDesc(objArr(cm)).slice(0,5);
  var tot=0;for(var i=0;i<sorted.length;i++)tot+=sorted[i][1];
  var ph='';
  if(tot===0){ph='<div style="text-align:center;color:#94A3B8;padding:16px;font-size:13px">지출 내역 없음</div>';}
  else{for(var i=0;i<sorted.length;i++){var cat=sorted[i][0],amt=sorted[i][1],p=Math.round(amt/tot*100);ph+='<div style="margin-bottom:9px"><div style="display:-webkit-box;display:flex;-webkit-box-pack:justify;justify-content:space-between;margin-bottom:3px"><span style="font-size:12px;font-weight:600;color:#1E293B">'+ge(cat)+' '+cat+'</span><span style="font-size:11px;color:#64748B">'+fmt(amt)+' ('+p+'%)</span></div><div style="height:7px;background:#F1F5F9;border-radius:4px;overflow:hidden"><div style="height:100%;width:'+p+'%;background:'+gc(cat)+';border-radius:4px"></div></div></div>';}}
  gi('pie').innerHTML=ph;
  var recent=mTx.slice().sort(function(a,b){return a.date<b.date?1:-1;}).slice(0,5);
  gi('rl').innerHTML=recent.length===0?'<div style="padding:20px;text-align:center;color:#94A3B8;font-size:13px">이달 거래 없음</div>':txsH(recent);
  var rs=computeReserveSummary(RESERVE_DATA);
  gi('homeReserveRemaining').textContent=fmt(rs.remaining);
}

function txH(t){
  var c=gc(t.category),mc=CONFIG.paymentColors[t.method]||'#94A3B8';
  var ac=t.type==='수입'?'#10B981':t.type==='저축'?'#3B82F6':'#EF4444';
  var sg=t.type==='수입'?'+':'-';
  var del=t.id>1000?'<button onclick="delTx('+t.id+')" style="background:none;border:none;padding:2px;font-size:11px;display:block;cursor:pointer">🗑</button>':'';
  return '<div style="display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;padding:11px 16px;border-bottom:1px solid #F1F5F9;background:white">'
    +'<div style="width:38px;height:38px;border-radius:12px;background:'+c+'20;display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;-webkit-box-pack:center;justify-content:center;margin-right:12px;-webkit-box-flex:0;flex-shrink:0;font-size:17px">'+ge(t.category)+'</div>'
    +'<div style="-webkit-box-flex:1;flex:1;min-width:0">'
    +'<div style="font-size:13px;font-weight:600;color:#1E293B;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+t.content+'</div>'
    +'<div style="font-size:11px;margin-top:2px;display:-webkit-box;display:flex;gap:5px;-webkit-box-align:center;align-items:center;flex-wrap:wrap">'
    +'<span style="background:'+c+'20;color:'+c+';padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600">'+t.category+'</span>'
    +'<span style="color:#94A3B8">'+t.date.slice(5)+'</span>'
    +'<span style="color:#CBD5E1">|</span>'
    +'<span style="background:'+mc+'20;color:'+mc+';padding:1px 6px;border-radius:4px;font-size:10px">'+t.method+'</span>'
    +'</div></div>'
    +'<div style="text-align:right;-webkit-box-flex:0;flex-shrink:0;margin-left:8px">'
    +'<div style="font-size:13px;font-weight:700;color:'+ac+'">'+sg+fmt(t.amount)+'</div>'+del+'</div></div>';
}
function txsH(arr){var h='';for(var i=0;i<arr.length;i++)h+=txH(arr[i]);return h;}

// ── 내역 렌더 ──
function renderList(){
  var tx=allTx();
  var mTx=[];for(var i=0;i<tx.length;i++){if(tx[i].month===CM)mTx.push(tx[i]);}
  var cats=['전체'].concat(uniq(mTx.map(function(t){return t.category;})));
  var methods=['전체'].concat(uniq(mTx.map(function(t){return t.method;})));
  var th='';
  for(var i=0;i<['전체','수입','지출','저축'].length;i++){var f=['전체','수입','지출','저축'][i];var on=AF.type===f;th+='<button class="fb'+(on?' on':'')+'" style="'+(on?'background:#0D9488;color:white':'')+'" data-fk="type" data-fv="'+esc(f)+'" onclick="setF(this.getAttribute(&quot;data-fk&quot;),this.getAttribute(&quot;data-fv&quot;))">'+esc(f)+'</button>'; }
  gi('ft').innerHTML=th;
  var ch='';
  for(var i=0;i<Math.min(cats.length,12);i++){var c=cats[i];var on=AF.cat===c;var col=c==='전체'?'#6366F1':gc(c);ch+='<button class="fb sm'+(on?' on':'')+'" style="'+(on?'background:'+col+';color:white':'')+'" data-fk="cat" data-fv="'+esc(c)+'" onclick="setF(this.getAttribute(&quot;data-fk&quot;),this.getAttribute(&quot;data-fv&quot;))">'+(c==='전체'?'전체':ge(c)+' '+esc(c))+'</button>'; }
  gi('fc').innerHTML=ch;
  var mh='';
  for(var i=0;i<methods.length;i++){var m=methods[i];var on=AF.method===m;var col=(CONFIG.paymentColors[m]||'#6366F1');mh+='<button class="fb sm'+(on?' on':'')+'" style="'+(on?'background:'+col+';color:white':'')+'" data-fk="method" data-fv="'+esc(m)+'" onclick="setF(this.getAttribute(&quot;data-fk&quot;),this.getAttribute(&quot;data-fv&quot;))">💳 '+(m==='전체'?'전체':esc(m))+'</button>'; }
  gi('fm').innerHTML=mh;
  var q=gi('srch').value||'';
  var filtered=[];
  for(var i=0;i<mTx.length;i++){
    var t=mTx[i];
    if(AF.type!=='전체'&&t.type!==AF.type)continue;
    if(AF.cat!=='전체'&&t.category!==AF.cat)continue;
    if(AF.method!=='전체'&&t.method!==AF.method)continue;
    if(q&&t.content.indexOf(q)===-1&&t.category.indexOf(q)===-1)continue;
    filtered.push(t);
  }
  filtered.sort(function(a,b){return a.date<b.date?1:-1;});
  var tot=0;for(var i=0;i<filtered.length;i++){if(filtered[i].type==='지출')tot+=filtered[i].amount;}
  gi('lc').textContent=filtered.length+'건';
  gi('lt').textContent=AF.type==='지출'?'지출 '+fmt(tot):'';
  gi('tl').innerHTML=filtered.length===0?'<div style="padding:40px;text-align:center;color:#94A3B8;font-size:13px">내역 없음</div>':txsH(filtered);
}
function setF(k,v){AF[k]=v;renderList();}

// ── 통계 렌더 ──
function renderStats(){
  var maxV=0;
  var monthly=computeMonthlySummary(allTx());
  for(var m=MIN_MONTH;m<=MAX_MONTH;m++){var s=monthly[m]||{i:0,e:0,s:0};if(s.i>maxV)maxV=s.i;if(s.e>maxV)maxV=s.e;if(s.s>maxV)maxV=s.s;}
  var bh='';
  for(var m=MIN_MONTH;m<=MAX_MONTH;m++){
    var s=monthly[m]||{i:0,e:0,s:0};
    var ih=maxV?Math.round(s.i/maxV*100):0,eh=maxV?Math.round(s.e/maxV*100):0,sh=maxV?Math.round(s.s/maxV*100):0;
    bh+='<div style="-webkit-box-flex:1;flex:1;display:-webkit-box;display:flex;-webkit-box-orient:vertical;-webkit-box-direction:normal;flex-direction:column;-webkit-box-align:center;align-items:center">'
      +'<div style="display:-webkit-box;display:flex;-webkit-box-align:end;align-items:flex-end;height:100px;gap:2px;-webkit-box-pack:center;justify-content:center">'
      +'<div style="width:9px;height:'+ih+'px;background:#10B981;border-radius:2px 2px 0 0"></div>'
      +'<div style="width:9px;height:'+eh+'px;background:#EF4444;border-radius:2px 2px 0 0"></div>'
      +'<div style="width:9px;height:'+sh+'px;background:#3B82F6;border-radius:2px 2px 0 0"></div>'
      +'</div><div style="font-size:10px;color:#64748B;margin-top:4px">'+m+'월</div></div>';
  }
  gi('bc').innerHTML=bh;
  var tx=allTx();
  var cm={};for(var i=0;i<tx.length;i++){var t=tx[i];if(t.type==='지출'&&t.amount>0)cm[t.category]=(cm[t.category]||0)+t.amount;}
  var sorted=sortDesc(objArr(cm));
  var tot=0;for(var i=0;i<sorted.length;i++)tot+=sorted[i][1];
  var ch='';
  for(var i=0;i<sorted.length;i++){var cat=sorted[i][0],amt=sorted[i][1],p=Math.round(amt/tot*100);ch+='<div style="margin-bottom:10px"><div style="display:-webkit-box;display:flex;-webkit-box-pack:justify;justify-content:space-between;margin-bottom:3px"><span style="font-size:12px;font-weight:600;color:#1E293B">'+ge(cat)+' '+cat+'</span><span style="font-size:11px;color:#64748B">'+fmt(amt)+' ('+p+'%)</span></div><div style="height:5px;background:#F1F5F9;border-radius:3px;overflow:hidden"><div style="height:100%;width:'+p+'%;background:'+gc(cat)+';border-radius:3px"></div></div></div>';}
  gi('cs').innerHTML=ch;
}

// ── 설정 렌더 ──
function renderSettings(){
  var tx=allTx();
  gi('settingsSummaryTitle').textContent='📊 '+APP_YEAR+'년 전체 현황 ('+tx.length+'건)';
  var tI=0,tE=0,tS=0;
  for(var i=0;i<tx.length;i++){if(tx[i].type==='수입')tI+=tx[i].amount;else if(tx[i].type==='지출'&&tx[i].amount>0)tE+=tx[i].amount;else if(tx[i].type==='저축')tS+=tx[i].amount;}
  var rows=[['총 수입',tI,'#10B981'],['총 지출',tE,'#EF4444'],['총 저축',tS,'#3B82F6'],['순 잔액',tI-tE-tS,(tI-tE-tS)>=0?'#059669':'#DC2626']];
  var sh='';for(var i=0;i<rows.length;i++){sh+='<div style="display:-webkit-box;display:flex;-webkit-box-pack:justify;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F1F5F9"><span style="font-size:13px;color:#64748B">'+rows[i][0]+'</span><span style="font-size:13px;font-weight:700;color:'+rows[i][2]+'">'+fmt(rows[i][1])+'</span></div>';}
  gi('ts').innerHTML=sh;
  var mh='';for(var i=0;i<CONFIG.paymentMethods.length;i++){var m=CONFIG.paymentMethods[i];mh+='<span style="padding:5px 10px;border-radius:8px;font-size:10px;font-weight:600;margin:3px;display:inline-block;background:'+(CONFIG.paymentColors[m]||'#94A3B8')+'20;color:'+(CONFIG.paymentColors[m]||'#94A3B8')+'">'+esc(m)+'</span>';}
  gi('mt').innerHTML=mh;
}

function renderReserve(){
  RESERVE_DATA=normalizeReserveData(RESERVE_DATA);
  var rs=computeReserveSummary(RESERVE_DATA);
  gi('rvTotal').textContent=fmt(rs.totalBudget);
  gi('rvSpent').textContent=fmt(rs.totalSpent);
  gi('rvRemain').textContent=fmt(rs.remaining);
  var cats=RESERVE_DATA.categories||[], ch='';
  if(cats.length===0){ch='<div style="text-align:center;color:#94A3B8;padding:16px;font-size:13px">예비비 분류 없음</div>';}
  for(var i=0;i<cats.length;i++){
    var c=cats[i], remain=(parseInt(c.remaining,10)||0), budget=parseInt(c.budget,10)||0, spent=parseInt(c.spent,10)||0;
    var pct=budget?Math.min(100,Math.round(spent/budget*100)):0;
    ch+='<div style="padding:10px 0;border-bottom:1px solid #F1F5F9">'
      +'<div style="display:-webkit-box;display:flex;-webkit-box-pack:justify;justify-content:space-between;gap:8px"><span style="font-size:13px;font-weight:700;color:#1E293B">'+esc(c.name)+'</span><span style="font-size:12px;font-weight:700;color:#0D9488">남음 '+fmt(remain)+'</span></div>'
      +'<div style="display:-webkit-box;display:flex;-webkit-box-pack:justify;justify-content:space-between;margin-top:4px;font-size:11px;color:#64748B"><span>예산 '+fmt(budget)+'</span><span>지출 '+fmt(spent)+'</span></div>'
      +'<div style="height:6px;background:#F1F5F9;border-radius:4px;overflow:hidden;margin-top:6px"><div style="height:100%;width:'+pct+'%;background:#14B8A6;border-radius:4px"></div></div>'
      +(c.memo?'<div style="font-size:11px;color:#94A3B8;margin-top:4px">'+esc(c.memo)+'</div>':'')+'</div>';
  }
  gi('rvCats').innerHTML=ch;
  var deps=RESERVE_DATA.deposits||[], dh='';
  if(deps.length===0){dh='<div style="text-align:center;color:#94A3B8;padding:16px;font-size:13px">예비비 입금 내역 없음</div>';}
  for(var j=0;j<deps.length;j++){
    var d=deps[j];
    dh+='<div style="display:-webkit-box;display:flex;-webkit-box-pack:justify;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #F1F5F9"><div style="min-width:0"><div style="font-size:13px;font-weight:600;color:#1E293B;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(d.content)+'</div><div style="font-size:11px;color:#94A3B8;margin-top:2px">'+esc(d.date)+'</div></div><div style="font-size:13px;font-weight:800;color:#10B981;white-space:nowrap">+'+fmt(d.amount)+'</div></div>';
  }
  gi('rvDeposits').innerHTML=dh;
  var exps=RESERVE_DATA.expenses||[], eh='';
  if(exps.length===0){eh='<div style="text-align:center;color:#94A3B8;padding:18px;font-size:13px">예비비 지출 내역 없음</div>';}
  for(var k=0;k<exps.length;k++){
    var e=exps[k];
    eh+='<div style="padding:10px 0;border-bottom:1px solid #F1F5F9"><div style="display:-webkit-box;display:flex;-webkit-box-pack:justify;justify-content:space-between;gap:10px"><div style="min-width:0"><div style="font-size:13px;font-weight:600;color:#1E293B;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(e.no)+'. '+esc(e.content)+'</div><div style="font-size:11px;color:#94A3B8;margin-top:2px">'+esc(e.date)+' · '+esc(e.category)+(e.memo?' · '+esc(e.memo):'')+'</div></div><div style="font-size:13px;font-weight:800;color:#EF4444;white-space:nowrap">-'+fmt(e.amount)+'</div></div></div>';
  }
  gi('rvExpenses').innerHTML=eh;
}

// ── 모달 ──
function openM(){
  var mm=CM<10?'0'+CM:''+CM;
  gi('fd').value=APP_YEAR+'-'+mm+'-01';
  gi('fcontent').value='';gi('fa').value='';
  setT('지출');
  var cs=gi('fcat'),ckeys=Object.keys(CONFIG.categorySubs),h='';
  for(var i=0;i<ckeys.length;i++){h+='<option value="'+esc(ckeys[i])+'">'+ge(ckeys[i])+' '+esc(ckeys[i])+'</option>';}
  cs.innerHTML=h; cs.value='식비'; updSub();
  var ms=gi('fmet'),mh='';
  for(var i=0;i<CONFIG.paymentMethods.length;i++){mh+='<option value="'+esc(CONFIG.paymentMethods[i])+'">'+esc(CONFIG.paymentMethods[i])+'</option>';}
  gi('fmet').innerHTML=mh;
  gi('modal').className='modal-bg open';
}
function closeM(){gi('modal').className='modal-bg';}
function setT(t){
  FT=t;
  var types=['지출','수입','저축'],cols={지출:'#EF4444',수입:'#10B981',저축:'#3B82F6'};
  for(var i=0;i<3;i++){var b=gi('tb'+i);b.style.background=types[i]===t?cols[t]:'#F1F5F9';b.style.color=types[i]===t?'white':'#64748B';}
}
function updSub(){
  var cat=gi('fcat').value,subs=CONFIG.categorySubs[cat]||[],h='';
  for(var i=0;i<subs.length;i++){h+='<option value="'+esc(subs[i])+'">'+esc(subs[i])+'</option>';}
  gi('fsub').innerHTML=h;
}
function addTx(){
  var content=gi('fcontent').value.replace(/^\s+|\s+$/g,'');
  var amount=parseInt(gi('fa').value)||0;
  if(!content||!amount)return;
  var tx=normalizeTx({id:Date.now(),date:gi('fd').value,content:content,amount:amount,
    category:gi('fcat').value,sub:gi('fsub').value,
    method:gi('fmet').value,type:FT});
  extras.push(tx);
  try{localStorage.setItem('bgt5',JSON.stringify(extras));}catch(e){}
  closeM(); renderHome();
  if(gi('p-list').style.display!=='none')renderList();
}
function delTx(id){
  var ne=[];for(var i=0;i<extras.length;i++){if(extras[i].id!==id)ne.push(extras[i]);}
  extras=ne;
  try{localStorage.setItem('bgt5',JSON.stringify(extras));}catch(e){}
  renderHome();
  if(gi('p-list').style.display!=='none')renderList();
}

// ── 시작 ──
try {
  renderHome();
} catch(err) {
  document.body.innerHTML = '<div style="padding:20px;font-size:14px;color:red;word-break:break-all"><b>오류 발생:</b><br>' + err.toString() + '<br><br>' + (err.stack||'') + '</div>';
}
</script>
